# ==========================================
# 1. SERIAL & CONSOLE SUBSYSTEMS
# ==========================================
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# ==========================================
# 2. MODERN USB STACK (For ttyACM0)
# ==========================================
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

# ==========================================
# 3. HARDWARE PERIPHERALS
# ==========================================
# Required to control the physical LED pin
CONFIG_GPIO=y

# ==========================================
# 4. MULTI-CORE SCHEDULING (SMP)
# ==========================================
# Required to wake up CPU 1 and allow thread pinning
CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y
